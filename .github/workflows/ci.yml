name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check app tests

      - name: Ruff format
        run: ruff format --check app tests

      - name: Mypy
        run: mypy app

      # Integration tests skip themselves when PostgreSQL or a connector
      # database is not reachable; run them locally against Docker Compose.
      - name: Tests
        run: pytest -q tests

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint and typecheck
        run: npm run lint

      - name: Build frontend
        run: npm run build
