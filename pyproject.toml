[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "decision-sql"
version = "0.1.0"
description = "Governed Text-to-SQL workspace: one typed model decision, then deterministic SQL gates"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13,<2.0",
    "cryptography>=42,<47",
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "opentelemetry-api>=1.27,<2.0",
    "opentelemetry-sdk>=1.27,<2.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "sqlglot>=25.0,<30.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13,<2.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.8,<1.0",
]
mysql = ["PyMySQL>=1.1,<2"]
sqlserver = ["pymssql>=2.3,<3"]
trino = ["trino>=0.330,<1"]
snowflake = ["snowflake-connector-python>=3.12,<5"]
bigquery = ["google-cloud-bigquery>=3.25,<4"]
connectors = [
    "PyMySQL>=1.1,<2",
    "pymssql>=2.3,<3",
    "trino>=0.330,<1",
    "snowflake-connector-python>=3.12,<5",
    "google-cloud-bigquery>=3.25,<4",
]

[tool.setuptools.packages.find]
include = ["app*", "demo*"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["alembic/versions", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app", "demo"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = "(^|/)(alembic/versions/|tests/)"

[[tool.mypy.overrides]]
# Optional connector drivers are installed on demand and ship without complete stubs.
module = ["pymysql.*", "pymssql.*", "trino.*", "snowflake.*", "google.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
