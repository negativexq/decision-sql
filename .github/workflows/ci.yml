name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: decision_sql
          POSTGRES_USER: decision_admin
          POSTGRES_PASSWORD: decision_admin_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U decision_admin -d decision_sql"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      ADMIN_DATABASE_URL: postgresql+psycopg://decision_admin:decision_admin_password@localhost:5432/decision_sql
      DATABASE_URL: postgresql+psycopg://decision_reader:decision_reader_password@localhost:5432/decision_sql
      # A skipped PostgreSQL suite fails the job instead of passing silently.
      DECISION_SQL_REQUIRE_POSTGRES: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check app tests

      - name: Ruff format
        run: ruff format --check app tests

      - name: Mypy
        run: mypy app

      - name: Prepare database
        env:
          PGPASSWORD: decision_admin_password
        run: |
          psql -h localhost -U decision_admin -d decision_sql -v ON_ERROR_STOP=1 -f docker-entrypoint-initdb.d/01-roles.sql
          alembic upgrade head
          python -m demo.seed

      # MySQL and Trino connector tests still skip here; run them locally with Docker.
      - name: Tests
        run: pytest -q tests

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint and typecheck
        run: npm run lint

      - name: Build frontend
        run: npm run build
